name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # D1 解析/建表与部署都需要，放在 job 级别
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          # wrangler 4.x 要求 Node.js >= 22
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build for Cloudflare Workers
        run: pnpm cf:build
        env:
          # NEXT_PUBLIC_* 在构建期注入，需在仓库
          # Settings -> Secrets and variables -> Actions -> Variables 中配置
          NEXT_PUBLIC_STORAGE_TYPE: ${{ vars.NEXT_PUBLIC_STORAGE_TYPE || 'd1' }}
          NEXT_PUBLIC_ENABLE_REGISTER: ${{ vars.NEXT_PUBLIC_ENABLE_REGISTER }}
          NEXT_PUBLIC_SEARCH_MAX_PAGE: ${{ vars.NEXT_PUBLIC_SEARCH_MAX_PAGE }}
          NEXT_PUBLIC_IMAGE_PROXY: ${{ vars.NEXT_PUBLIC_IMAGE_PROXY }}
          NEXT_PUBLIC_DOUBAN_PROXY: ${{ vars.NEXT_PUBLIC_DOUBAN_PROXY }}
          NEXT_PUBLIC_DISABLE_YELLOW_FILTER: ${{ vars.NEXT_PUBLIC_DISABLE_YELLOW_FILTER }}

      - name: Resolve D1 database
        id: d1
        env:
          # 可选：设置仓库 secret D1_DATABASE_ID 可指定已有数据库；
          # 未设置时按名称查找，找不到就自动创建
          D1_ID: ${{ secrets.D1_DATABASE_ID }}
        run: |
          set -euo pipefail
          DB_NAME=moontv
          find_id() {
            npx wrangler d1 list --json \
              | jq -r --arg n "$DB_NAME" '.[] | select(.name == $n) | .uuid' | head -n1
          }

          id="${D1_ID:-}"
          if [ -z "$id" ]; then
            id="$(find_id)"
          fi

          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "🆕 D1 数据库 $DB_NAME 不存在，正在创建…"
            npx wrangler d1 create "$DB_NAME"
            id="$(find_id)"
          fi

          if [ -z "$id" ] || [ "$id" = "null" ]; then
            echo "❌ 无法解析 D1 database_id" >&2
            exit 1
          fi

          echo "🔗 使用 D1 数据库: $DB_NAME ($id)"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Inject D1 database id into wrangler.jsonc
        run: sed -i 's|\${D1_DATABASE_ID}|${{ steps.d1.outputs.id }}|' wrangler.jsonc

      - name: Apply D1 schema
        # schema.sql 全部是 CREATE ... IF NOT EXISTS，幂等，可重复执行
        run: npx wrangler d1 execute moontv --remote --file=./schema.sql

      - name: Deploy Worker
        # 用项目自己的脚本部署，复用 devDependencies 里锁定的 wrangler 版本，
        # 与本地 `pnpm cf:deploy` 完全一致。--keep-vars 保留 Dashboard 上设置的变量。
        run: pnpm cf:deploy -- --keep-vars

      - name: Sync Worker secrets
        # 从仓库 secrets 批量下发 USERNAME / PASSWORD（放在部署之后，
        # 因为首次部署时 Worker 还不存在，secret bulk 会失败）
        env:
          SECRET_USERNAME: ${{ secrets.USERNAME }}
          SECRET_PASSWORD: ${{ secrets.PASSWORD }}
        run: |
          set -euo pipefail

          json="$(jq -n \
            --arg u "${SECRET_USERNAME:-}" \
            --arg p "${SECRET_PASSWORD:-}" \
            '{} | if $u != "" then .USERNAME = $u else . end
                | if $p != "" then .PASSWORD = $p else . end')"

          if [ "$json" = "{}" ]; then
            echo "⏭️ 仓库未配置 USERNAME / PASSWORD secret，跳过"
            exit 0
          fi

          echo "🔐 下发 Worker secrets: $(printf '%s' "$json" | jq -r 'keys | join(", ")')"
          printf '%s' "$json" | npx wrangler secret bulk
